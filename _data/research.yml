- title: 'Commuting Infrastructure in Fragmented Cities'
  pdf: '/papers/fragmented_cities_obordeu.pdf'
  status: 'R&amp;R at Review of Economic Studies'
  summary: "Cities are often divided into local governments, each responsible for their local commuting infrastructure used by local residents, workers, and outsiders. This paper examines how metropolitan fragmentation impacts the provision of commuting infrastructure and the spatial distribution of economic activity. I develop a quantitative spatial model in which municipalities compete for residents and workers by investing in commuting infrastructure to maximize net land value within their jurisdictions. In equilibrium, relative to a metropolitan planner, municipalities underinvest in areas near their boundaries and overinvest in areas away from the boundary. Central municipalities tend to underinvest more, as higher commuting costs encourage households to move closer to where they work, thereby increasing land values in central areas. Decentralized investment results in higher cross-jurisdiction commuting costs, more dispersed employment, and more polycentric patterns of economic activity. I estimate the model using data from Santiago, Chile, and find substantial gains from centralizing investment decisions. Centralization allocates infrastructure more efficiently and increases aggregate expenditure on infrastructure."

- title: 'Bank Branches and the Allocation of Capital across Cities'
  pdf: '/papers/BordeuGonzalezSora_BanksSpatial.pdf'
  coauthors:
  - {name: 'Gustavo González', website: 'https://sites.google.com/view/gustavo-gonzalez'}
  - {name: 'Marcos Sorá', website: 'https://www.marcossora.com/'}
  summary: "We study how frictions in interbank lending and imperfect competition within local credit markets shape the allocation of capital across cities. Using public and administrative data from Chile, we estimate the pass-through of bank-level deposit shocks to local lending and interest rates. We find the pass-through to be stronger in cities where the bank holds a smaller market share, consistent with imperfect competition. We develop and estimate a quantitative spatial model with multi-city banks, oligopolistic competition in local credit markets, and interbank lending frictions that rationalizes these results. In the model, the cost of credit varies in space as banks with greater deposit funding lend at lower rates in all markets they serve, and cities served by more competing bank branches face lower rates through stronger local competition. We find that capital misallocation arising from spatial variation in loan markups reduces steady-state GDP by 0.55 percent, while frictions in interbank lending reduce GDP by 0.1 percent. We then use the model to evaluate bank mergers, which trade off greater spatial financial integration against weaker local competition, with larger competition losses when merging banks overlap in more cities. In Chile, the competition losses outweigh the gains from integration."

- title: 'Local Credit Markets and Firm Borrowing Costs'
  pdf: '/papers/local_credit_markets_BGSS.pdf'
  status: 'Submitted'
  coauthors:
  - {name: 'Gustavo González', website: 'https://sites.google.com/view/gustavo-gonzalez'}
  - {name: 'Maximiliano San Millán', website: 'https://maxsanmillan.github.io'}
  - {name: 'Marcos Sorá', website: 'https://www.marcossora.com/'}
  summary: "Using administrative data on the universe of bank loans to Chilean firms, we document that firm borrowing costs vary widely across cities. Among comparable firms and loans, average spreads differ by 196 basis points between cities at the 10th and 90th percentiles. Location accounts for about a third of the variance in city-average spreads, as much as loan and firm characteristics and more than borrower risk or bank identity. Location premia are higher in richer cities and in more concentrated credit markets, but these characteristics explain only about a fifth of their variation."
